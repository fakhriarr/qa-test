name: Source and build gates
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: qa-test-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run check:lock
      - run: npm run check:source
      - run: npm run typecheck
      - run: npm test
      # No fake keys, database mocks, migrations or deployment. This builds the setup-gated UI shell.
      - run: npm run build
